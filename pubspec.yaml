name: kadal_aayus
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- Required for localization and Malayalam dates ---
  flutter_localizations:
    sdk: flutter

  # ======== Firebase Suite ========
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.1
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: 5.4.4

  # ======== Core Utilities ========
  http: ^1.5.0
  url_launcher: ^6.3.0
  location: ^8.0.1
  path_provider: ^2.1.3
  # --- Updated to resolve dependency conflict ---
  intl: ^0.20.2
  translator: ^1.0.4+1
  json_annotation: ^4.9.0
  geolocator: ^12.0.0
  geocoding: ^3.0.0

  # ======== UI and Widgets ========
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  flutter_compass: ^0.8.1
  font_awesome_flutter: ^10.7.0
  cupertino_icons: ^1.0.8

  # ======== Local Storage & Notifications ========
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^19.4.1

  # ======== Audio & TTS ========
  flutter_tts: ^3.8.5
  just_audio: ^0.9.36


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Build runner and code generation
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/compass.png
