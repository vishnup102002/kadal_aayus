name: kadal_aayus
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ======== Firebase Suite ========
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  firebase_messaging: ^16.0.1 # ✅ FCM is included
  cloud_firestore: ^6.0.1
  firebase_storage: ^13.0.1
  google_sign_in: 5.4.4

  # ======== Notification Packages ========
  flutter_local_notifications: ^19.4.1 # ✅ Local notifications are included

  # ======== Core Feature Packages ========
  url_launcher: ^6.3.0
  location: ^8.0.1
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  flutter_tts: ^4.2.3
  just_audio: ^0.10.5

  # ======== Local Storage / Caching ========
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # ======== UI ========
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
